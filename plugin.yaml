name: yuanbao
kind: platform
version: 1.0.0
description: >
  Yuanbao (元宝) platform adapter — plugin override for the built-in yuanbao.
  Fixes the group chat media bug: observed (non-@bot) group messages now
  download media resources to local cache immediately so the model can
  access them directly via local file paths instead of stale ybres anchors.
  Also reverses observed-media backfill scan order (newest-first) and limits
  backfill to 1 resource per turn to avoid blocking.
author: ptbsare
requires_env:
  - YUANBAO_APP_ID
  - YUANBAO_APP_SECRET
